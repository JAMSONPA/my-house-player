name: APK Android (TV box)

on:
  push:
    branches: [main]
    paths: ['app/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copiar o app web para dentro do APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r app/. android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/lista-config.json

      - name: Montar o APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "error:|ERROR|FAILURE|What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk ../MyHouse.apk

      - name: Publicar o APK (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk MyHouse.apk --title "MY HOUSE para TV box Android" --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o MyHouse.apk e instale na TV box." --latest
