plugins {
    id 'com.android.application'
}
android {
    namespace 'br.com.jamson.player'
    compileSdk 34
    defaultConfig {
        applicationId 'br.com.jamson.player'
        minSdk 21
        targetSdk 34
        /* cada montagem no GitHub ganha um número maior: é assim que o app sabe que há versão nova */
        versionCode 100 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        versionName '1.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    /* chave fixa (guardada nos segredos do GitHub): sem ela, uma versão nova não instala por cima da antiga */
    def chave = System.getenv('MYHOUSE_KEYSTORE')
    def temChave = chave != null && new File(chave).exists()
    signingConfigs {
        fixa {
            if (temChave) {
                storeFile new File(chave)
                storePassword System.getenv('MYHOUSE_KEYSTORE_SENHA')
                keyAlias 'myhouse'
                keyPassword System.getenv('MYHOUSE_KEYSTORE_SENHA')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig temChave ? signingConfigs.fixa : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
